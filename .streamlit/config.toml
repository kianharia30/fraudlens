[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[client]
# Never show raw tracebacks to app users; errors are logged server-side.
showErrorDetails = false
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
